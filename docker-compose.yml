services:
  portfolio:
    build: .
    container_name: rohnelt-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - NODE_ENV=production
      - LIVE_DATA_DIR=/data
      - AGENT_TOKEN=${AGENT_TOKEN}
    volumes:
      - portfolio-data:/data

volumes:
  portfolio-data:
