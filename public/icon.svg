<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip0">
      <rect width="180" height="180" rx="37" />
    </clipPath>

    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f1f"/>
      <stop offset="100%" stop-color="#080812"/>
    </linearGradient>

    <!-- Letter gradient: cyan-blue matching --primary oklch(0.65 0.19 230) -->
    <linearGradient id="letterGrad" x1="14" y1="53" x2="163" y2="127" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#93c5fd"/>
      <stop offset="40%"  stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle radial center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Border glow gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#clip0)">
    <!-- Background -->
    <rect width="180" height="180" rx="37" fill="url(#bgGrad)"/>

    <!-- Center radial glow -->
    <rect width="180" height="180" fill="url(#centerGlow)"/>

    <!-- The N logo paths with gradient fill and glow -->
    <g filter="url(#glow)" style="transform: scale(95%); transform-origin: center">
      <path
        fill="url(#letterGrad)"
        d="M101.141 53H136.632C151.023 53 162.689 64.6662 162.689 79.0573V112.904H148.112V79.0573C148.112 78.7105 148.098 78.3662 148.072 78.0251L112.581 112.898C112.701 112.902 112.821 112.904 112.941 112.904H148.112V126.672H112.941C98.5504 126.672 86.5638 114.891 86.5638 100.5V66.7434H101.141V100.5C101.141 101.15 101.191 101.792 101.289 102.422L137.56 66.7816C137.255 66.7563 136.945 66.7434 136.632 66.7434H101.141V53Z"/>
      <path
        fill="url(#letterGrad)"
        d="M65.2926 124.136L14 66.7372H34.6355L64.7495 100.436V66.7372H80.1365V118.47C80.1365 126.278 70.4953 129.958 65.2926 124.136Z"/>
    </g>

    <!-- Border glow ring -->
    <rect width="180" height="180" rx="37" fill="none"
          stroke="url(#borderGrad)" stroke-width="1.5"/>
  </g>
</svg>